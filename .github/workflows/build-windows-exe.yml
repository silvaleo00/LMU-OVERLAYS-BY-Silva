name: build-windows-exe

# Compila o .exe num PC Windows do GitHub e publica a versão.
#  - Quando o lmuov/version.py muda no main (o publicar_versao.bat faz isso) e essa versão ainda não
#    foi publicada: testa, compila e cria a Release "vX.Y.Z" com o LMU_Overlays_Windows.zip.
#    As apps dos teus amigos veem a versão nova e mostram o botão "Atualizar".
#  - Também publica ao enviar uma tag "v1.2.3" (forma antiga).
#  - Manualmente (Actions > build-windows-exe > Run workflow): compila e publica a versão do
#    version.py se ainda não existir; se já existir, o zip fica só em Artifacts.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lmuov/version.py"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyside6-essentials pyinstaller
      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $f = "lmuov/version.py"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $v = "${{ github.ref_name }}".TrimStart("v")
            $publish = "true"
          } else {
            $line = Get-Content $f | Where-Object { $_ -match '^VERSION = ' } | Select-Object -First 1
            $v = ($line -replace '^VERSION = ', '').Trim().Trim('"')
            git fetch --tags --quiet
            $exists = git tag --list "v$v"
            $publish = if ($exists) { "false" } else { "true" }
          }
          $repo = "${{ github.repository }}"
          (Get-Content $f) -replace '^VERSION = .*', "VERSION = `"$v`"" -replace '^UPDATE_REPO = .*', "UPDATE_REPO = `"$repo`"" | Set-Content $f -Encoding utf8
          Get-Content $f
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $v · publicar: $publish"
      - name: Testes
        run: python tests/test_core.py
      - name: Gerar .exe
        run: python -m PyInstaller --noconfirm --clean lmu_overlays.spec
      - name: Juntar LEIA-ME e criar o zip
        shell: pwsh
        run: |
          Copy-Item "LEIA-ME_amigos.txt" "dist/LMU Overlays/LEIA-ME.txt"
          Compress-Archive -Path "dist/LMU Overlays" -DestinationPath "dist/LMU_Overlays_Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LMU_Overlays_Windows
          path: dist/LMU_Overlays_Windows.zip
      - name: Publicar a versão (Release)
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/LMU_Overlays_Windows.zip
          generate_release_notes: true
