name: build-windows-exe

# Compila o .exe num PC Windows do GitHub e publica a versão.
#  - Ao enviar uma tag "v1.2.3" (o publicar_versao.bat faz isso): testa, compila e cria a Release
#    com o LMU_Overlays_Windows.zip. As apps dos teus amigos veem a versão nova e mostram o botão
#    "Atualizar".
#  - Manualmente (Actions > build-windows-exe > Run workflow): só compila; o zip fica em Artifacts.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyside6-essentials pyinstaller
      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $repo = "${{ github.repository }}"
          $f = "lmuov/version.py"
          (Get-Content $f) -replace '^VERSION = .*', "VERSION = `"$v`"" -replace '^UPDATE_REPO = .*', "UPDATE_REPO = `"$repo`"" | Set-Content $f -Encoding utf8
          Get-Content $f
      - name: Testes
        run: python tests/test_core.py
      - name: Gerar .exe
        run: python -m PyInstaller --noconfirm --clean lmu_overlays.spec
      - name: Juntar LEIA-ME e criar o zip
        shell: pwsh
        run: |
          Copy-Item "LEIA-ME_amigos.txt" "dist/LMU Overlays/LEIA-ME.txt"
          Compress-Archive -Path "dist/LMU Overlays" -DestinationPath "dist/LMU_Overlays_Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LMU_Overlays_Windows
          path: dist/LMU_Overlays_Windows.zip
      - name: Publicar a versão (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LMU_Overlays_Windows.zip
          generate_release_notes: true
